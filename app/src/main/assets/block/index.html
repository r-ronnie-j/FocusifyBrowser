<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Blocked</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background: url('./background.jpg') repeat center center fixed;
            background-color: #00000011
            background-size: cover;
            color: #fff;
        }
        .overlay {
            padding: 40px;
            border-radius: 12px;
            text-align: center;
        }
        .container img {
            width: 150px;
            height: 150px;
            margin-bottom: -8px;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="overlay">
    <div class="container">
        <img src="./cancel.png" alt="Blocked Icon">
        <h1>Access Denied</h1>
        <p>The webpage you are trying to visit has been blocked as per your set
            policies.</p>
        <p>Stay focused, stay productive.</p>
    </div>
</div>
</body>
</html>
